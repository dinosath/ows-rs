[package]
name = "ows-playground"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
ows-workflow-editor = { path = "../crates/ows-workflow-editor" }
ows-dsl = { path = "../crates/ows-dsl" }
ows-expressions = { path = "../crates/ows-expressions" }
serde_json = "1.0"
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http"] }
futures-util = "0.3"
http = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
futures-executor = "0.3"
